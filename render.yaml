# Blueprint de Render: crea el servicio web (Node/Express) y una base de
# datos Postgres gratis, y los conecta automaticamente (DATABASE_URL se
# inyecta sola en el servicio web).
#
# Como usarlo: en el dashboard de Render, "New" -> "Blueprint", elegi este
# repositorio de GitHub, y Render lee este archivo solo.
databases:
  - name: halloween-manos-db
    plan: free
    databaseName: halloween_manos
    user: halloween_manos

services:
  - type: web
    name: halloween-manos-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: halloween-manos-db
          property: connectionString
